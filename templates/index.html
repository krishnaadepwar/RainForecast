<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rainfall Prediction - Maharashtra</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    crossorigin="anonymous"
  />
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: url("https://images.pexels.com/photos/4297438/pexels-photo-4297438.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940")
        no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Overlay to darken the background */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-weight: 600;
      color: #007d85;
      text-align: center;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    label {
      font-weight: 600;
      color: #007d85;
    }

    input[type="text"] {
      border: 2px solid #00b7c2;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 16px;
      width: 100%;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #005f63;
      outline: none;
      box-shadow: 0 0 8px #005f63;
    }

    button.btn-primary {
      background-color: #00b7c2;
      border: none;
      width: 100%;
      padding: 14px;
      font-weight: 700;
      font-size: 18px;
      border-radius: 50px;
      margin-top: 20px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button.btn-primary:hover {
      background-color: #005f63;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Maharashtra Rainfall Prediction</h1>
    <form action="/predict" method="post" novalidate>
      <div class="form-group">
        <label for="month">Month (1-12)</label>
        <input
          type="text"
          id="month"
          name="Month"
          placeholder="Enter month number"
          required
          pattern="^(0?[1-9]|1[0-2])$"
          title="Enter a valid month number (1-12)"
        />
      </div>
      <div class="form-group">
        <label for="year">Year (e.g., 2025)</label>
        <input
          type="text"
          id="year"
          name="Year"
          placeholder="Enter year"
          required
          pattern="^\d{4}$"
          title="Enter a valid 4-digit year"
        />
      </div>
      <button type="submit" class="btn btn-primary">Predict Rainfall</button>
    </form>
  </div>
</body>
</html>
