<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rainfall Prediction Result</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    crossorigin="anonymous"
  />
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: url("https://images.pexels.com/photos/4297438/pexels-photo-4297438.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940")
        no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-weight: 600;
      color: #007d85;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .result-text {
      font-size: 22px;
      font-weight: 600;
      margin: 30px 0;
      color: #005f63;
    }

    form {
      margin-top: 20px;
      text-align: left;
    }

    label {
      font-weight: 600;
      color: #007d85;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"] {
      border: 2px solid #00b7c2;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 16px;
      width: 100%;
      margin-bottom: 20px;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #005f63;
      outline: none;
      box-shadow: 0 0 8px #005f63;
    }

    button.btn-primary {
      background-color: #00b7c2;
      border: none;
      width: 100%;
      padding: 14px;
      font-weight: 700;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button.btn-primary:hover {
      background-color: #005f63;
    }

    .back-btn {
      margin-top: 25px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Maharashtra Rainfall Prediction</h1>
    <p class="result-text">
      The predicted rainfall for <strong>{{Month}}/{{Year}}</strong> is:
      <br /><span style="font-size: 30px; color: #007d85;">{{res}} mm</span>
    </p>

    <form action="/" method="post" novalidate>
      <label for="month">Month (1-12)</label>
      <input
        type="text"
        id="month"
        name="Month"
        placeholder="{{Month}}"
        required
        pattern="^(0?[1-9]|1[0-2])$"
        title="Enter a valid month number (1-12)"
      />
      <label for="year">Year (e.g., 2025)</label>
      <input
        type="text"
        id="year"
        name="Year"
        placeholder="{{Year}}"
        required
        pattern="^\d{4}$"
        title="Enter a valid 4-digit year"
      />
      <button type="submit" class="btn btn-primary">Predict Again</button>
    </form>

    <a href="/" class="btn btn-outline-primary back-btn">Back to Home</a>
  </div>
</body>
</html>
